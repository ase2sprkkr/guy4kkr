[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guy4kkr"
version = "0.1.0"
description = "PyQt6 GUI for building/editing ASE structures and running SPR-KKR via ase2sprkkr."
requires-python = ">=3.9"
dependencies = [
  "kkrunner>=0.1.0b1,<0.2",
  "PyQt6",
  "matplotlib",
  "numpy",
  "ase",
  "platformdirs",
  "pyxtal",
  "ase2sprkkr>=4.0.0b1",
]

[project.scripts]
guy4ase = "guy4ase.main:main"

[project.entry-points."ase2sprkkr"]
cli = "guy4ase.cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["guy4ase*"]

[tool.setuptools.package-data]
guy4ase = [
  "assets/icons/*.svg",
  "assets/icons/*.md",
  "assets/icons/COPYING-ICONS",
  "assets/structures/*.dat",
  "assets/structures/*.md",
]

[tool.uv.sources]
ase2sprkkr = { path = "../ase2sprkkr", editable = true }
kkrunner = { path = "../kkrunner", editable = true }
