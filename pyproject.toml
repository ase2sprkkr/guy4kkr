[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guy4kkr"
version = "0.1.0"
description = "PyQt6 GUI for building/editing ASE structures and running SPR-KKR via ase2sprkkr."
requires-python = ">=3.9"
dependencies = [
  "PyQt6",
  "matplotlib",
  "numpy",
  "ase",
  "platformdirs",
  "pyxtal",
  "ase2sprkkr",
]

[project.scripts]
guy4ase = "guy4ase.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["guy4ase*"]
