name: tests

on:
  push:
    branches-ignore:
      - 'chatgpt-**'
      - 'tmp-**'
  pull_request:

jobs:
  tests:
    if: >-
      github.event_name != 'pull_request' ||
      (!startsWith(github.head_ref, 'chatgpt-') &&
       !startsWith(github.head_ref, 'tmp-'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Check Python 3.9 source compatibility
        run: python tests/test_python39_compat.py

      - name: Checkout Guy4ase-compatible ase2sprkkr
        uses: actions/checkout@v4
        with:
          repository: ase2sprkkr/ase2sprkkr
          ref: workflow
          path: .ci/ase2sprkkr

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./.ci/ase2sprkkr
          python -m pip install -e . pytest

      - name: Run tests
        run: python -m pytest -q
