name: targeted diagnostics

on:
  push:
    branches:
      - 'chatgpt-diagnostic-targeted'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Check Python 3.9 source compatibility
        run: python tests/test_python39_compat.py
      - name: Checkout Guy4ase-compatible ase2sprkkr
        uses: actions/checkout@v7
        with:
          repository: ase2sprkkr/ase2sprkkr
          ref: workflow
          path: .ci/ase2sprkkr
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./.ci/ase2sprkkr
          python -m pip install -e . pytest
      - name: Run targeted tests
        run: >-
          python -m pytest -q
          tests/test_bsf_calculation_setup.py
          tests/test_exception_boundaries.py
          tests/test_input_parameter_flows.py
          tests/test_input_file_editor.py
          tests/test_guided_task_availability.py
          tests/test_backend_persistence_contract.py
          tests/test_persistent_result_application.py
          tests/test_recompute_task_routing.py
