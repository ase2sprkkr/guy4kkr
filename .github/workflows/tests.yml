name: targeted diagnostics

on:
  push:
    branches:
      - 'chatgpt-diagnostic-targeted'

concurrency:
  group: targeted-diagnostics
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Checkout Guy4ase-compatible ase2sprkkr
        uses: actions/checkout@v7
        with:
          repository: ase2sprkkr/ase2sprkkr
          ref: workflow
          path: .ci/ase2sprkkr
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./.ci/ase2sprkkr
          python -m pip install -e . pytest
      - name: Show first BSF failure
        continue-on-error: true
        run: >-
          python -m pytest -vv -x
          tests/test_bsf_calculation_setup.py::test_bsf_serializes_and_reloads_without_wrong_mode_keywords
      - name: Diagnose BSF family reader
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from ase2sprkkr.input_parameters.input_parameters import InputParameters
          from guy4ase.gui.flows.input_parameters import _read_for_task_family

          with TemporaryDirectory() as tmp:
              path = Path(tmp) / 'plane.inp'
              plane = InputParameters.create('bsfkk')
              plane.CONTROL.POTFIL.set('Fe.pot')
              plane.set({
                  'ENERGY': {'NE': [1]},
                  'TASK': {
                      'KA': [[0.0, 0.0, 0.0]],
                      'K1': [1.0, 0.0, 0.0],
                      'K2': [0.0, 1.0, 0.0],
                      'NK1': 45,
                      'NK2': 55,
                  },
              })
              plane.save_to_file(path)
              print(path.read_text())
              for task in ('bsfek', 'bsfkk'):
                  try:
                      loaded = _read_for_task_family(path, (task,))
                  except Exception as exc:
                      print(task, 'ERROR', type(exc).__name__, repr(exc))
                  else:
                      print(task, 'OK', loaded.definition_name, loaded.task_name,
                            loaded.task_definition.name)
          PY
