name: tests

on:
  push:
    branches-ignore:
      - 'chatgpt-**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  tests:
    if: >-
      github.event_name != 'pull_request' ||
      !startsWith(github.head_ref, 'chatgpt-')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Check Python 3.9 source compatibility
        run: python tests/test_python39_compat.py

      # PR #229 contains the Project/Job/RunManager contract under validation.
      # Do not test against the older ase2sprkkr/workflow API.
      - name: Checkout ASE2SPRKKR API refactor PR #229
        uses: actions/checkout@v7
        with:
          repository: lokik/ase2sprkkr-chat
          ref: refs/pull/229/head
          path: .ci/ase2sprkkr

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./.ci/ase2sprkkr
          python -m pip install -e . pytest

      - name: Run tests
        run: python -m pytest -q
