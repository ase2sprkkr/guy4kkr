name: backend compatibility

on:
  workflow_call:
    inputs:
      guy4ase_repository:
        description: Guy4ASE repository to test (owner/name)
        required: false
        type: string
        default: ase2sprkkr/guy4kkr
      ase2sprkkr_ref:
        description: Exact ase2sprkkr ref to test against
        required: false
        type: string
        default: develop
      guy4ase_ref:
        description: Exact Guy4ASE ref to test
        required: false
        type: string
        default: master
  workflow_dispatch:
    inputs:
      guy4ase_repository:
        description: Guy4ASE repository to test (owner/name); empty means this repository
        required: false
        type: string
        default: ''
      ase2sprkkr_ref:
        description: ase2sprkkr branch, tag, or commit to test against
        required: false
        type: string
        default: develop
      guy4ase_ref:
        description: Guy4ASE branch, tag, or commit to test; empty uses the selected workflow branch
        required: false
        type: string
        default: ''
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["3.9","3.10","3.11","3.12","3.13","3.14"]' || '["3.9","3.14"]') }}
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - name: Checkout Guy4ASE
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.guy4ase_repository || github.repository }}
          ref: ${{ inputs.guy4ase_ref || (github.event_name == 'workflow_dispatch' && github.ref_name) || 'master' }}
          path: guy4ase

      - name: Checkout ASE2SPRKKR
        uses: actions/checkout@v7
        with:
          repository: ase2sprkkr/ase2sprkkr
          ref: ${{ inputs.ase2sprkkr_ref || 'develop' }}
          path: ase2sprkkr

      - name: Checkout KKRunner
        uses: actions/checkout@v7
        with:
          repository: ase2sprkkr/kkrunner
          ref: master
          path: kkrunner

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            guy4ase/pyproject.toml
            ase2sprkkr/pyproject.toml
            kkrunner/pyproject.toml

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Install backend and Guy4ASE
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./kkrunner
          python -m pip install -e ./ase2sprkkr
          python -m pip install -e ./guy4ase pytest

      - name: Run Guy4ASE against selected backend
        working-directory: guy4ase
        run: python -m pytest -q
